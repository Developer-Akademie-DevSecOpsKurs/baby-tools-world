name: Check open PR for feature branch

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-for-open-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check if current branch has an open PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking open PR for branch: $BRANCH_NAME"

          PR_COUNT=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --head "$BRANCH_NAME" \
            --json number \
            --jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No open PR found for branch '$BRANCH_NAME'."
            echo "Please create a pull request before submitting this branch."
            exit 1
          fi

          echo "Open PR found for branch '$BRANCH_NAME'."
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Check if current branch has more than one commit ahead of main
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          COMMIT_COUNT=$(git rev-list --count origin/main..HEAD)
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "Branch '$BRANCH_NAME' has only $COMMIT_COUNT commit(s) ahead of main."
            echo "Please add more commits to the branch before submitting a pull request."
            exit 1
          fi

          echo "Branch '$BRANCH_NAME' has $COMMIT_COUNT commits ahead of main."
